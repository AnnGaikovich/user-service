apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:1.0
        imagePullPolicy: Never  
        ports:
        - containerPort: 8080
          name: http
          
        volumeMounts:
        - name: jwt-keys
          mountPath: /app/keys
          readOnly: true
        
        # Health Probes (Liveness и Readiness)
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90  
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"  
        - name: APP_JWT_PUBLIC_KEY
          value: "file:/app/keys/public.pem"  
        - name: DB_URL
          value: "jdbc:postgresql://postgres-service:5432/user_service_db"
        - name: DB_USERNAME
          value: "postgres"
        - name: DB_PASSWORD
          value: "123456"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis-service"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
          
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
            
        # Health checks
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
      
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-secret
          items:
          - key: public.pem
            path: public.pem