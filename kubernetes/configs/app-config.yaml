apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: user-service
data:
  application.yml: |
    spring:
      profiles:
        active: kubernetes
      application:
        name: user-service
      
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
      
      cache:
        type: redis
        redis:
          time-to-live: 600000
      
      liquibase:
        enabled: true
      
      autoconfigure:
        exclude:
          - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
          base-path: /actuator
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true
    
    server:
      port: 8080
    
    logging:
      level:
        com.example.userservice: INFO