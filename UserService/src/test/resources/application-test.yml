spring:
  security:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  datasource:
    url: jdbc:postgresql://localhost:${postgres.container.port}/testdb
    username: test
    password: test
  liquibase:
    enabled: false
  data:
    redis:
      host: localhost
      port: ${redis.container.port}
  cache:
    type: none

server:
  port: 0

logging:
  level:
    org.example.userservice: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info