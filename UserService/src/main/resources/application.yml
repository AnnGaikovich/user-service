spring:
  profiles:
    active: local
  application:
    name: UserService

---
# Local Profile (для разработки)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:true}
    show-sql: ${SHOW_SQL:false}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 60000
    cache:
      type: redis
      redis:
        time-to-live: 600000  # 10 минут в миллисекундах

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

server:
  port: 8080

logging:
  level:
    com.example.app: DEBUG
    org.hibernate.SQL: ${LOG_SQL:DEBUG}

---
# Docker Profile (для контейнеризации)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/user_service_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
    show-sql: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  data:
    redis:
      host: redis
      port: 6380
      password:
      timeout: 60000
    cache:
      type: redis
      redis:
        time-to-live: 600000

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

server:
  port: 8080

logging:
  level:
    com.example.app: INFO
    org.hibernate.SQL: WARN