spring:
  profiles:
    active: local
  application:
    name: UserService

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true

app:
    jwt:
      public-key: classpath:keys/public.pem
      issuer: auth-service

internal:
  api-key: ${USER_SERVICE_API_KEY:internal-auth-key-12345}

---
# Local Profile (for development)
spring:
  config:
    activate:
      on-profile: local
  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:123456}
      driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:true}
    show-sql: ${SHOW_SQL:false}
  liquibase:
      change-log: ${LIQUIBASE_CHANGE_LOG:classpath:/db/changelog/db.changelog-master.yaml}
      enabled: ${LIQUIBASE_ENABLED:true}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 60000

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 min

management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always
    security:
      enabled: false

# JWT Configuration
app:
  jwt:
    public-key: classpath:keys/public.pem
    issuer: auth-service

internal:
  api-key: ${USER_SERVICE_API_KEY:internal-auth-key-12345}

server:
  port: 8080

logging:
  level:
    org.example.userservice: DEBUG
    org.hibernate.SQL: ${LOG_SQL:DEBUG}

---
# Docker Profile (for containerization)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url:  ${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        show_sql: ${SHOW_SQL:false}
        format_sql: ${FORMAT_SQL:true}
    show-sql: ${SHOW_SQL:false}
  liquibase:
    change-log: ${LIQUIBASE_CHANGE_LOG:classpath:/db/changelog/db.changelog-master.yaml}
    enabled: ${LIQUIBASE_ENABLED:true}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  data:
    redis:
      host: redis
      port: 6379
      password:
      timeout: 60000

  cache:
      type: redis
      redis:
        time-to-live: 600000 # 10 мин

management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

# JWT Configuration
app:
  jwt:
    public-key: file:/app/keys/public.pem
    issuer: auth-service

internal:
  api-key: ${USER_SERVICE_API_KEY:internal-auth-key-12345}

server:
  port: 8080

logging:
  level:
    com.example.userservice: INFO
    org.hibernate.SQL: WARN

